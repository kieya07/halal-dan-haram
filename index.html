
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petualangan Halal-Haram</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffe5ec,#e8e1ff,#dff7ff);color:#382b50;text-align:center}
main{max-width:850px;margin:auto;padding:20px}
h1{color:#7953a5;font-size:clamp(27px,5vw,42px)}
.card{background:#fffdf8;padding:24px;border-radius:24px;margin:18px 0;box-shadow:0 7px 0 #ded2f0}
button{border:0;border-radius:15px;padding:14px;margin:6px;cursor:pointer;font-size:16px;font-weight:bold;background:#e8dcff;color:#382b50}
button:hover{filter:brightness(.96)}
.choice{display:block;width:100%;text-align:left;background:#f4efff;border:2px solid #e2d5f8}
.correct{background:#d8f8d1!important}.wrong{background:#ffdbe4!important}
.hidden{display:none}.level{display:inline-block;width:40%;min-width:220px;vertical-align:top;padding:16px;box-sizing:border-box;border-radius:18px;margin:5px}
#feedback{min-height:45px;line-height:1.5;font-weight:bold}
.story{background:#fff0bd;border-radius:15px;padding:14px;line-height:1.5}
#music{background:#7953a5;color:white;border-radius:30px}
</style>
</head>
<body>
<main>
<h1>🍓 Petualangan Halal–Haram 🥤</h1>
<p>Jadilah detektif makanan dan minuman halal!</p>

<section class="card">
<h3>🎵 </h3>
<p>Tekan tombol untuk memutar atau menghentikan melodi instrumental.</p>
<button id="music" onclick="toggleMusic()">▶ Putar Musik</button>
</section>

<section class="card">
<h3>⭐ Skor: <span id="score">0</span> |
Petualangan: <span id="done">0</span>/4</h3>
<div id="menu">
<h2>Pilih Petualangan</h2>
<div id="levels"></div>
</div>

<div id="game" class="hidden">
<p id="label"></p>
<p id="number"></p>
<div id="story" class="story hidden"></div>
<h2 id="question"></h2>
<div id="options"></div>
<p id="feedback"></p>
<button id="next" onclick="next()" disabled>Soal Berikutnya ➜</button>
<button onclick="home()">Menu</button>
</div>

<div id="result" class="hidden">
<h2 id="resultTitle"></h2>
<p id="resultText"></p>
<button onclick="nextLevel()">Lanjut ➜</button>
<button onclick="home()">Menu</button>
</div>

<div id="finish" class="hidden">
<h2>🏆 Hebat, Semua Misi Selesai!</h2>
<p id="summary"></p>
<button onclick="restart()">Main Lagi 🔁</button>
</div>
</section>
</main>

<script>
const data=[
{title:"🍉 Kebun Camilan",q:[
["Manakah makanan yang halal?",["Daging babi","Buah semangka","Darah"],1,"Buah-buahan seperti semangka pada dasarnya halal."],
["Rani membeli ayam goreng. Apa yang perlu dipastikan?",["Penyembelihan dan pengolahannya sesuai ketentuan halal","Warnanya cerah","Harganya mahal"],0,"Bahan dan cara pengolahan makanan juga perlu diperhatikan."],
["Makanan halal adalah makanan yang ...",["Selalu mahal","Diperbolehkan menurut syariat","Dari luar negeri"],1,"Halal berarti diperbolehkan menurut syariat Islam."]]},
{title:"🥤 Dunia Minuman",q:[
["Minuman manakah yang halal?",["Air putih bersih","Minuman memabukkan","Khamr"],0,"Air putih bersih pada dasarnya halal."],
["Mengapa khamr dilarang?",["Warnanya gelap","Memabukkan dan dilarang dalam Islam","Rasanya pahit saja"],1,"Khamr dilarang karena memabukkan dan merusak akal."],
["Dina menemukan minuman tanpa informasi bahan yang jelas. Apa yang sebaiknya dilakukan?",["Langsung minum","Memeriksa komposisi dan kehalalannya","Memilih berdasarkan warna"],1,"Periksa informasi produk sebelum memilihnya."]]},
{title:"🛒 Pasar Pintar",q:[
["Makanan diketahui mengandung bahan haram. Bagaimana hukumnya?",["Tetap halal karena enak","Haram jika tidak ada pengecualian syar'i","Halal jika mahal"],1,"Bahan haram tidak menjadi halal hanya karena rasanya enak."],
["Bimo melihat label halal pada kemasan. Apa tindakan yang tepat?",["Memeriksa informasi produk dengan cermat","Menganggap semua produk lain haram","Memilih dari warna"],0,"Periksa label dan informasi produk dengan cermat."],
["Mengapa memilih makanan halal dan thayyib itu penting?",["Agar sesuai ajaran Islam dan baik bagi diri","Supaya mengejek teman","Agar terlihat kaya"],0,"Halal dan thayyib berarti diperbolehkan dan baik."]]},
{title:"🕵️ Detektif Cerita",q:[
["Saat istirahat, Farah mendapat permen tanpa informasi bahan yang jelas.",["Langsung memakan semuanya","Memeriksa bahan dan kehalalannya dahulu","Membuang bekal teman"],1,"Farah bisa memeriksa informasi produk dengan sopan."],
["Riko tahu makanan di kantin mengandung bahan haram, tetapi teman-temannya membelinya.",["Ikut agar sama dengan teman","Memilih makanan halal lainnya","Menyembunyikan informasi"],1,"Riko sebaiknya memilih makanan halal dengan santun."],
["Siti membawa bekal yang sudah dipastikan halal. Temannya berkata halal hanya penting untuk orang dewasa.",["Halal penting bagi umat Islam pada usia berapa pun","Halal hanya penting di sekolah","Semua bekal otomatis halal"],0,"Memilih makanan halal penting untuk umat Islam pada usia berapa pun."]]}
];

let level=0,index=0,score=0,done=new Set(),locked=false;
const $=id=>document.getElementById(id);
function renderMenu(){
 $("levels").innerHTML="";
 data.forEach((d,i)=>{
  const b=document.createElement("button");
  b.className="level";
  b.textContent=d.title+" — 3 soal";
  b.disabled=i>0&&!done.has(i-1);
  b.onclick=()=>start(i);
  $("levels").appendChild(b);
 });
 $("done").textContent=done.size;
 $("score").textContent=score;
}
function show(id){["menu","game","result","finish"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");}
function home(){renderMenu();show("menu")}
function start(i){level=i;index=0;show("game");question()}
function question(){
 locked=false;
 const q=data[level].q[index];
 $("label").textContent=data[level].title;
 $("number").textContent="Soal "+(index+1)+" dari 3";
 $("question").textContent=q[0];
 $("story").classList.toggle("hidden",level!==3);
 $("story").textContent=level===3?"Baca situasi berikut, lalu pilih tindakan yang paling tepat.": "";
 $("feedback").textContent="Pilih jawaban yang paling tepat.";
 $("next").disabled=true;
 $("next").textContent=index===2?"Selesaikan Petualangan":"Soal Berikutnya ➜";
 $("options").innerHTML="";
 q[1].forEach((o,i)=>{
  const b=document.createElement("button");
  b.className="choice";
  b.textContent=String.fromCharCode(65+i)+". "+o;
  b.onclick=()=>answer(i,b);
  $("options").appendChild(b);
 });
}
function answer(i,btn){
 if(locked)return;
 locked=true;
 const q=data[level].q[index];
 [...$("options").children].forEach((b,j)=>{
  b.disabled=true;
  if(j===q[2])b.classList.add("correct");
 });
 if(i===q[2]){score+=10;$("feedback").textContent="Benar! 🌟 "+q[3]}
 else{btn.classList.add("wrong");$("feedback").textContent="Belum tepat. 💡 "+q[3]}
 $("score").textContent=score;
 $("next").disabled=false;
}
function next(){
 if(!locked)return;
 if(index<2){index++;question();return}
 done.add(level);
 $("resultTitle").textContent=data[level].title+" selesai! 🎉";
 $("resultText").textContent="Kamu menyelesaikan 3 soal. Skor saat ini: "+score;
 show("result");
}
function nextLevel(){
 if(level===3){
  $("summary").textContent="Kamu menyelesaikan 12 soal dengan "+score+" dari 120 poin!";
  show("finish");
 }else{start(level+1)}
}
function restart(){score=0;done=new Set();home()}

/* Musik instrumental ceria dibuat langsung oleh browser */
let ctx=null,playing=false,timer=null,n=0;
const notes=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,587.33,659.25,523.25,440,523.25,659.25,587.33];
function tone(freq,time,duration){
 const osc=ctx.createOscillator(),gain=ctx.createGain();
 osc.type="sine";osc.frequency.value=freq;
 gain.gain.setValueAtTime(.0001,time);
 gain.gain.exponentialRampToValueAtTime(.06,time+.025);
 gain.gain.exponentialRampToValueAtTime(.0001,time+duration);
 osc.connect(gain);gain.connect(ctx.destination);
 osc.start(time);osc.stop(time+duration+.03);
}
function musicStep(){
 if(!playing)return;
 const t=ctx.currentTime;
 tone(notes[n%notes.length],t,.3);
 if(n%4===0)tone(notes[n%notes.length]/2,t,.42);
 n++;timer=setTimeout(musicStep,360);
}
async function toggleMusic(){
 if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
 if(playing){
  playing=false;clearTimeout(timer);$("music").textContent="▶ Putar Musik";return;
 }
 await ctx.resume();playing=true;$("music").textContent="⏸ Hentikan Musik";musicStep();
}
home();
</script>
</body>
</html>
